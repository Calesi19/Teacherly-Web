<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      (function (location) {
        if (location.search[1] === "/") {
          const redirect = location.search
            .slice(1)
            .split("&")
            .map((part) => part.replace(/~and~/g, "&"))
            .join("?");
          window.history.replaceState(
            null,
            "",
            location.pathname.slice(0, -1) + redirect + location.hash,
          );
        }
      })(window.location);
    </script>
    <script type="text/javascript">
      (function () {
        const storageKey = "theme";
        const THEME_COLOR = {
          dark: "#0a0a0a",
          light: "#ffffff",
        };

        function getSystemTheme() {
          return window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        const storedTheme = localStorage.getItem(storageKey);
        const resolvedTheme =
          storedTheme === "dark" || storedTheme === "light"
            ? storedTheme
            : getSystemTheme();

        const root = document.documentElement;
        root.classList.remove("light", "dark");
        root.classList.add("glass-5");
        root.classList.add(resolvedTheme);
        root.style.colorScheme = resolvedTheme;

        const themeColorMeta = document.querySelector(
          'meta[name="theme-color"]',
        );
        if (themeColorMeta) {
          themeColorMeta.setAttribute("content", THEME_COLOR[resolvedTheme]);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%pwa-icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-touch-icon" href="%BASE_URL%pwa-icon.svg" />
    <title>Teacherly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
